name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish VS Code extension
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=markdown-selection-notes-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies --out "${{ steps.metadata.outputs.vsix }}"

      - name: Publish to Visual Studio Marketplace with Trusted Publishing
        run: npx @vscode/vsce publish --oidc --packagePath "${{ steps.metadata.outputs.vsix }}"
