name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run Preview DOM E2E tests
        run: npm run test:e2e:dom

      - name: Run real VS Code Preview UI E2E tests
        run: xvfb-run -a npm run test:e2e:ui
