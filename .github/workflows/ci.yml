name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run Preview DOM E2E tests
        run: npm run test:e2e:dom

      - name: Run real VS Code Preview UI E2E tests
        run: xvfb-run -a npm run test:e2e:ui

      - name: Require a new release version on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git fetch --tags --force
          latest_tag="$(git tag --sort=-v:refname | head -n 1)"

          if [ -z "$latest_tag" ]; then
            echo "No release tag exists yet; the first version may be published."
            exit 0
          fi

          current_version="$(node -p "require('./package.json').version")"
          published_version="${latest_tag#v}"

          if [ "$current_version" = "$published_version" ]; then
            echo "package.json version $current_version is already released as $latest_tag."
            echo "Bump package.json version before merging to main."
            exit 1
          fi
